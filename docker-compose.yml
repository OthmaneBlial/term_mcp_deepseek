services:
  term-mcp-deepseek:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: "$DEEPSEEK_API_KEY"
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: "false"
      LOG_LEVEL: "INFO"
      WORKSPACE_ROOT: "/workspace"
    volumes:
      - ./:/workspace
    restart: unless-stopped
