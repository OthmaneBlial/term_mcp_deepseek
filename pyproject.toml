[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "term-mcp-deepseek"
dynamic = ["version"]
description = "Approval-first MCP terminal control plane with bounded execution and signed receipts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Othmane Blial" }]
keywords = ["mcp", "deepseek", "terminal", "agent", "json-rpc", "security", "receipts"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "Flask>=2.3.3,<4",
  "jsonschema>=4.20,<5",
  "PyJWT>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = [
  "mcp==2.1.1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-mock>=3.14,<4",
]
dev = [
  "term-mcp-deepseek[test]",
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.12,<1",
  "twine>=6,<8",
]

[project.scripts]
term-mcp = "term_mcp_deepseek.cli:main"

[project.urls]
Homepage = "https://github.com/OthmaneBlial/term_mcp_deepseek"
Repository = "https://github.com/OthmaneBlial/term_mcp_deepseek"
Issues = "https://github.com/OthmaneBlial/term_mcp_deepseek/issues"

[tool.setuptools]
include-package-data = true
py-modules = ["config", "mcp_server", "server", "stdio_server"]

[tool.setuptools.dynamic]
version = { attr = "term_mcp_deepseek._version.VERSION" }

[tool.setuptools.package-data]
term_mcp_deepseek = [
  "schemas/*.json",
  "static/*.css",
  "static/*.html",
  "static/*.js",
  "static/*.svg",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["term_mcp_deepseek*", "api*", "models*", "tools*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".venv", "venv", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--tb=short",
  "--cov=term_mcp_deepseek",
  "--cov=api",
  "--cov=tools.json_rpc",
  "--cov-report=term-missing",
  "--cov-fail-under=65",
]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "slow: slow tests",
  "auth: authentication tests",
  "api: API tests",
]
